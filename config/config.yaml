autotest:
    name: Pro6000-test-2048 # or comment out this line to use random name
    sheet_name: Benchmark-Pro6000
server:
    platform: Pro6000
    id: all-in-one-qwen3-8b
    # id: all-in-one-mistral-7b-and-gpt-oss-120b

benchmark:
    id: random-8-512-common

# you should only edit the config above
healthcheck:
    url: "${server.base_url}:${server.port}/health"
    timeout: 5
    max_tries: 100
    interval: 5.0

default_config:
    server:
        - id: all-in-one-mistral-7b-and-gpt-oss-120b
          config:
            container:
                # sglang ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: sglang-Mistral-7B-v0.3
                  name: sglang_mistra
                  tp_size: 1
                  port: 30001
                  endpoint_type: completions
                  model_name: mistralai/Mistral-7B-v0.3
                  model_id: test

                # failed
                # - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                #   service_name: sglang-gpt-oss-120b
                #   name: sglang
                #   tp_size: 1
                #   port: 30002
                #   endpoint_type: chat
                #   model_name: openai/gpt-oss-120b
                #   model_id: test

                # vllm ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: vllm-Mistral-7B-v0.3
                  name: vllm_mistra
                  tp_size: 1
                  port: 30003
                  endpoint_type: completions
                  model_name: mistralai/Mistral-7B-v0.3
                  model_id: test

                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: vllm-gpt-oss-120b
                  name: vllm_gptoss
                  tp_size: 1
                  port: 30004
                  endpoint_type: chat
                  model_name: openai/gpt-oss-120b
                  model_id: test

                # lmdeploy ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: lmdeploy-Mistral-7B-v0.3
                  name: lmdeploy_mistra
                  tp_size: 1
                  port: 30005
                  endpoint_type: completions
                  model_name: mistralai/Mistral-7B-v0.3
                  model_id: test

                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: lmdeploy-gpt-oss-120b
                  name: lmdeploy_gptoss
                  tp_size: 1
                  port: 30006
                  endpoint_type: chat
                  model_name: openai/gpt-oss-120b
                  model_id: test

                # tensorrt-llm ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: tensorrt-llm-Mistral-7B-v0.3
                  name: tensorrt-llm_mistra
                  tp_size: 1
                  port: 30007
                  endpoint_type: completions
                  model_name: mistralai/Mistral-7B-v0.3
                  model_id: Mistral-7B-v0.3

                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: tensorrt-llm-gpt-oss-120b
                  name: tensorrt-llm_gptoss
                  tp_size: 1
                  port: 30008
                  endpoint_type: chat
                  model_name: openai/gpt-oss-120b
                  model_id: gpt-oss-120b

            port: 0
            base_url: http://localhost
            model_path: /home/ubuntu/models
            model_name: none
            model_id: none

        # ===================================
        - id: all-in-one-qwen3-8b
          config:
            container:
                # sglang ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: sglang-qwen3-8b
                  name: sglang_qwen38b
                  tp_size: 1
                  port: 30001
                  endpoint_type: completions
                  model_name: Qwen/Qwen3-8B
                  model_id: test

                # vllm ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: vllm-qwen3-8b
                  name: vllm_qwen38b
                  tp_size: 1
                  port: 30002
                  endpoint_type: completions
                  model_name: Qwen/Qwen3-8B
                  model_id: test

                # lmdeploy ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: lmdeploy-qwen3-8b
                  name: lmdeploy_qwen38b
                  tp_size: 1
                  port: 30003
                  endpoint_type: completions
                  model_name: Qwen/Qwen3-8B
                  model_id: test

                # tensorrt-llm ----------------------------------------------------------------
                - path: /home/ubuntu/workspace/jeff/Benchmark-Autotest/docker-compose.yml
                  service_name: tensorrt-llm-qwen3-8b
                  name: tensorrt-llm_qwen38b
                  tp_size: 1
                  port: 30004
                  endpoint_type: completions
                  model_name: Qwen/Qwen3-8B
                  model_id: Qwen3-8B

            port: 0
            base_url: http://localhost
            model_path: /home/ubuntu/models
            model_name: none
            model_id: none
    benchmark:
        - id: random-8-512-common
          config:
            name:
                - inferencemax-h100
            endpoint_type: none
            model_name: ${server.model_name}
            token_lengths:
                - input_len: 128
                  output_len: 2048
                - input_len: 2048
                  output_len: 128
            concurrency:
                # - 8
                # - 256
                - 512
            seeds:
                # - 2791784335
                # - 3627711926
                - 1143885486