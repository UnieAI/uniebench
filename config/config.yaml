autotest:
  name: benchmark-test-01
  sheet_name: Benchmark-Pro6000
server:
  platform: Pro6000
  id: default
benchmark:
  id: default
healthcheck:
  url: ${server.base_url}:${server.port}/health
  timeout: 5
  max_tries: 100
  interval: 5.0
default_config:
  server:
  - id: default
    config:
      container:
      - path: /workspace/jeff/Benchmark-Autotest/services/default/default_script.sh
        name: default_script
        tp_size: 1
        model_name: Qwen/Qwen3-0.6B
        model_id: qwen3-0.6b
        base_url: http://localhost
        port: 12470
      base_url: 0
      port: 0
      model_path: 0
      model_name: 0
      model_id: 0
  benchmark:
  - id: default
    config:
      name:
      - inferencemax-h100
      endpoint_type: completions
      model_name: ${server.model_name}
      dataset_path: /workspace/jeff/Benchmark-Autotest/datasets/neural-bridge/rag-dataset-12000/data/train-00000-of-00001-9df3a936e1f63191.parquet
      token_lengths:
      - input_len: none
        output_len: 1024
      concurrency:
      - 1
      - 16
      - 32
      - 64
      - 128
      - 256
      - 512
dashboard:
  scripts:
    enabled:
      default/default_script.sh: true
    metadata:
      default/default_script.sh:
        tp_size: '1'
        model_name: Qwen/Qwen3-0.6B
        model_id: qwen3-0.6b
        base_url: http://localhost
        port: '12470'
    last_test:
      default/default_script.sh:
        status: success
        tested_at: '2026-04-21T02:56:49Z'
        detail: ok | /tmp/host_script_test.log
  global_config:
    model_path: /home/ubuntu/models
    model_names:
    - AngelSlim/Qwen3-32B_eagle3
    - AngelSlim/Qwen3-8B_eagle3
    - Qwen/Qwen2.5-7B-Instruct
    - Qwen/Qwen3-0.6B
    - Qwen/Qwen3-32B
    - Qwen/Qwen3-8B
    - Qwen/Qwen3.5-0.8B
    - Qwen/Qwen3.5-27B
    - Qwen/Qwen3.5-9B
    - deepseek-ai/DeepSeek-OCR-2
    - google/gemma-4-E4B-it
    - meta-llama/Llama-3.3-70B-Instruct
    - mistralai/Voxtral-Mini-4B-Realtime-2602
    - z-lab/Qwen3-8B-DFlash-b16
    default_base_url: http://localhost
