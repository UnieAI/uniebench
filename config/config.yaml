autotest:
    # google worksheet 的工作表名稱
    name: A100-vllm-kernel-iter
server:
    platform: A100  # 測試平台
    id: test1       # 使用 default_config.server 底下，對應的 server

benchmark:
    id: test1       # 使用 default_config.benchmark 底下，對應的 benchmark 設定

healthcheck:
    url: "${server.base_url}:${server.port}/health"
    timeout: 5
    max_tries: 100
    interval: 5.0

default_config:
    server:
        - id: test1
          config:
            container:
                - path: none            # docker-compose.yml 路徑，或輸入 none 代表 server 已經在外部啟動
                  service_name: none    # 如果 docker-compose.yml 有多個 service，需要填入 service_name
                  name: vllm-iter1      # service 名稱，通常是推理引擎的名字+你做了什麼改動
                  tp_size: 1            # 用幾顆 gpu 跑
                  port: 12470           # 輸出的 port
            port: 0                     # 不用改
            base_url: http://localhost
            model_path: /mnt/models     # 模型路徑
            model_name: Qwen/Qwen3-8B   # 模型名稱， 路徑/名稱 會是 model 的具體位置
            model_id: /mnt/models/Qwen/Qwen3-8B/    # model_id，呼叫 api 時使用
    benchmark:
        - id: test1
          config:
            name:
                - inferencemax-h100             # 目前只能用 inferencemax-h100
            endpoint_type: chat                 # 可選 chat 或 completions，注意模型是否支援
            model_name: ${server.model_name}    # 不用改
            dataset_path: ./benchmark/datasets/MaziyarPanahi/Synthia-Coder-v1.5-I-sharegpt.json # dataset 路徑，移除此欄位的話會使用 random
            token_lengths:
                - input_len: 128                # 輸入跟輸出的長度，可以一次測試多個
                  output_len: 1024
                - input_len: 768
                  output_len: 768
            concurrency:
                - 1                            # 一次有幾個使用者同時跑，可以一次測試多個
                - 8
                - 512