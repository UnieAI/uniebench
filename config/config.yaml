autotest:
    name: A100-vllm-kernel-iter # or comment out this line to use random name
server:
    platform: A100
    id: 8B

benchmark:
    # id: sharegpt_gpt4-1-8-32-64
    id: sharegpt_gpt4-1-to-32
    sample_max_tokens: 768
# you should only edit the config above

healthcheck:
    url: "${server.base_url}:${server.port}/health"
    timeout: 5
    max_tries: 100
    interval: 5.0

default_config:
    server:
        - id: 8B
          config:
            container:
                - path: none
                  service_name: none
                  name: vllm-iter1
                  tp_size: 1
                  port: 12470
                # - path: /home/ubuntu/workspace/jeff/sglang/docker-compose.allservice.yml
                #   service_name: eagle8b
                #   name: eagle8b
                #   tp_size: 1
                #   port: 12470
                # - path: /home/ubuntu/workspace/jeff/sglang/docker-compose.allservice.yml
                #   service_name: ngram8b
                #   name: ngram8b
                #   tp_size: 1
                #   port: 12470
                # - path: /home/ubuntu/workspace/jeff/sglang/docker-compose.allservice.yml
                #   service_name: sglang8b
                #   name: sglang8b
                #   tp_size: 1
                #   port: 12470
            port: 0
            base_url: http://localhost
            model_path: /mnt/models
            model_name: Qwen/Qwen3-8B
            model_id: /mnt/models/Qwen/Qwen3-8B/
    benchmark:
        - id: Synthia-Coder-1-to-32
          config:
            name:
                - inferencemax-h100
            endpoint_type: chat
            model_name: ${server.model_name}
            interval: 120000
            dataset_path: ./benchmark/datasets/MaziyarPanahi/Synthia-Coder-v1.5-I-sharegpt.json
            token_lengths:
                - input_len: 768
                  output_len: 768
            concurrency:
                - 32
                - 16
                - 8
                - 4
                - 2
                - 1
        - id: Synthia-Coder-1-8-32-64
          config:
            name:
                - inferencemax-h100
            endpoint_type: chat
            model_name: ${server.model_name}
            interval: 120000
            dataset_path: ./benchmark/datasets/MaziyarPanahi/Synthia-Coder-v1.5-I-sharegpt.json
            # dataset_path: ./benchmark/datasets/G4KMU/hotpot_qa.jsonl
            token_lengths:
                - input_len: 768
                  output_len: 768
                # - input_len: 19
                #   output_len: 768
            concurrency:
                # - here
                - 1
                - 2
                - 4
                - 8
                - 16
                - 32
                - 64
                - 128
                - 256
            seeds: 
                - 315626925 
                - 1729138034
                - 1174402340
                - 316146629
                - 1343589209
                - 614356257
                - 864882793
                - 989814230

        - id: sharegpt_gpt4-1-to-32
          config:
            name:
                - inferencemax-h100
            endpoint_type: completions
            model_name: ${server.model_name}
            interval: 120000
            dataset_path: ./benchmark/datasets/shibing624/sharegpt_gpt4.jsonl
            token_lengths:
                - input_len: 768
                  output_len: 768
            concurrency:
                # - here
                - 1
                # - 2
                # - 4
                - 8
                # - 16
                - 32
                - 64
                # - 128
                - 256
            seeds: 
                - 315626925 
                - 1729138034
                - 1174402340
                - 316146629
                - 1343589209
                - 614356257
                - 864882793
                - 989814230

        - id: sharegpt_gpt4-1-8-32-64
          config:
            name:
                - inferencemax-h100
            endpoint_type: completions
            model_name: ${server.model_name}
            interval: 120000
            dataset_path: ./benchmark/datasets/shibing624/sharegpt_gpt4.jsonl
            token_lengths:
                - input_len: 768
                  output_len: 768
                - input_len: 19
                  output_len: 768
            concurrency:
                - 10 # warm up
                - 64
                - 32
                - 8
                - 1
