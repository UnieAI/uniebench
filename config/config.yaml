autotest:
    name: nano-sglang # or comment out this line to use random name
server:
    platform: H100-2
    container:
        # - path: "/home/ubuntu/workspace/jeff/Benchmark-Autotest/engine/nano-PEARL/docker-compose.yml"
        #   name: nano_pearl_api
        #   tp_size: 2
        #   port: 8990
        - path: none
          name: sglang-nano-v9
          tp_size: 2
          port: 12470
    port: 0
    base_url: http://localhost
    model_path: /home/ubuntu/models
    model_name: Qwen/Qwen3-32B
    model_id: test

healthcheck:
    url: "${server.base_url}:${server.port}/health"
    timeout: 5
    max_tries: 100
    interval: 5.0

benchmark:
    name:
        # - genai-perf
        - inferencemax-h100
    endpoint_type: chat
    model_name: ${server.model_name}
    interval: 120000
    token_lengths:
        - input_len: 768
          output_len: 768
    concurrency:
        # - 1
        - 8
        # - 32
