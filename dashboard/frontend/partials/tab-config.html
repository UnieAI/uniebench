<section id="config" class="panel active">
  <div id="configStatus" class="status" data-i18n="configNotLoaded">尚未載入 config</div>
  <div class="btn-row">
    <button id="loadConfig" class="action info" data-i18n="btnReload">重新載入</button>
    <button id="saveConfig" class="action success" data-i18n="btnSave">儲存設定</button>
  </div>
  <textarea id="configEditor" spellcheck="false"></textarea>
</section>
