services:
   service-d:
    image: nctu6/vllm-nightly-pd-fix
    runtime: nvidia
    ipc: host
    network_mode: host
    environment:
      - NCCL_DEBUG=INFO
      - NCCL_DEBUG_SUBSYS=INIT,P2P
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - CUDA_VISIBLE_DEVICES=3
      - NCCL_P2P_DISABLE=0
      - VLLM_DISABLE_REQUEST_ID_RANDOMIZATION=1 
    entrypoint: ["/usr/local/bin/vllm", "serve"]
    command: >
      --model /models/Qwen/Qwen3-0.6B
      --served-model-name test
      --host 0.0.0.0
      --port 8200
      --tensor-parallel-size 1
      --trust-remote-code
      --dtype bfloat16
      --speculative-config '{"method":"ngram_gpu","num_speculative_tokens":4,"draft_tensor_parallel_size":1,"prompt_lookup_min":3,"prompt_lookup_max":8}'
      --kv-transfer-config '{"kv_connector":"P2pNcclConnector","kv_role":"kv_consumer","kv_buffer_size":"8e9","kv_port":"14580","kv_connector_extra_config":{"proxy_ip":"0.0.0.0","proxy_port":"30001","http_port":"8200","send_type":"PUT_ASYNC","nccl_num_channels":"16"}}'

    volumes:
      - /workspace:/workspace
      - /workspace/models:/models
    shm_size: '1gb'
    ulimits:
      memlock: -1
      stack: 67108864
